plugins {
    id 'base'
    id 'architectury-plugin' version '3.4.162'
    id 'dev.architectury.loom' version '1.7.435' apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = mod_group_id
    version = mod_version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom'

    base { archivesName = "${rootProject.mod_id}-${project.name}" }
    repositories {
        mavenCentral()
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
    tasks.withType(ProcessResources).configureEach {
        def metadata = [version: project.version, mod_id: rootProject.mod_id,
                        mod_name: rootProject.mod_name, minecraft_version: rootProject.minecraft_version]
        inputs.properties(metadata)
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand(metadata) }
    }
}

tasks.named('build') { dependsOn ':fabric:build', ':neoforge:build' }
tasks.named('check') { dependsOn ':common:check', ':fabric:check', ':neoforge:check' }
